name: no_ela

model:
  active_branches: [prnu, content]
  feature_dim: 128
  classifier_hidden_dim: 64
  dropout: 0.5
  num_classes: 2

branch_overrides: {}

data:
  root: "./data/raw"
  image_size: 224
  val_ratio: 0.15
  test_ratio: 0.15
  seed: 42
  # max_samples_per_class: 2000

streams:
  content: true
  ela: false
  prnu: true

ela:
  quality: 95
  scale: 15.0

augmentation:
  random_hflip: true

training:
  learning_rate: 0.0001
  weight_decay: 0.0001
  batch_size: 32
  epochs: 50
  lr_min: 0.000001
  optimizer_betas: [0.9, 0.999]
  label_smoothing: 0.1
  grad_clip_norm: 1.0
  early_stopping_patience: 7
  num_workers: 4
